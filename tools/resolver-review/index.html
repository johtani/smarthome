<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolver dataset review</title>
  <style>
    :root { color-scheme: light; --ink:#17212b; --muted:#65717d; --paper:#f4f1ea; --card:#fffdf8; --line:#d9d2c5; --accent:#126e66; --warn:#a94b23; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 system-ui,sans-serif }
    header { padding:22px max(24px,calc((100vw - 1100px)/2)); background:#173d3a; color:white; display:flex; justify-content:space-between; gap:20px; align-items:end }
    h1 { margin:0; font:600 24px/1.2 Georgia,serif } #progress { color:#c9e7df }
    main { max-width:1100px; margin:24px auto; padding:0 24px; display:grid; grid-template-columns:240px 1fr; gap:24px }
    aside,.card { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 3px 14px #26332c12 }
    aside { padding:18px; align-self:start; position:sticky; top:20px } label { display:block; font-weight:600; margin:13px 0 5px }
    select,input,textarea,button { width:100%; font:inherit; border:1px solid #bcb5a8; border-radius:5px; padding:9px; background:white }
    input[type=checkbox] { width:auto } .check { font-weight:400; display:flex; gap:8px; align-items:center }
    .card { padding:24px } .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase }
    .input { font:500 23px/1.4 Georgia,serif; margin:8px 0 20px; white-space:pre-wrap }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px } .panel { border-top:2px solid var(--line); padding-top:10px }
    dt { color:var(--muted); font-size:12px } dd { margin:1px 0 10px; white-space:pre-wrap; overflow-wrap:anywhere }
    textarea { min-height:78px; resize:vertical } .warnings { margin:12px 0; display:flex; flex-wrap:wrap; gap:6px }
    .badge { background:#f7ddce; color:#713015; padding:3px 8px; border-radius:99px; font-size:12px }
    .actions { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px }
    button { cursor:pointer; font-weight:650 } button.primary { background:var(--accent); color:white; border-color:var(--accent) }
    button.exclude { color:#8e321d } .nav { display:flex; gap:8px; margin-top:16px } .nav button { width:auto }
    #message { min-height:24px; color:var(--accent) } .empty { text-align:center; padding:60px 20px; color:var(--muted) }
    @media (max-width:760px) { main { grid-template-columns:1fr } aside { position:static } .grid,.actions { grid-template-columns:1fr } }
  </style>
</head>
<body>
<header><h1>Resolver dataset review</h1><div id="progress"></div></header>
<main>
  <aside>
    <label for="filter">表示</label>
    <select id="filter">
      <option value="all">すべて</option><option value="unreviewed">未レビュー</option>
      <option value="incorrect">incorrect・補正なし</option><option value="catalog">catalog 違反</option>
      <option value="warnings">重複・矛盾</option><option value="accepted">採用</option>
      <option value="corrected">修正</option><option value="excluded">除外</option><option value="pending">保留</option>
    </select>
    <label class="check"><input id="onlyWarnings" type="checkbox"> 警告のみ</label>
    <p id="count"></p><small id="output"></small>
  </aside>
  <section><div id="message"></div><div id="content" class="card"></div></section>
</main>
<script>
let data={rows:[],catalog:[]}, visible=[], cursor=0;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(row){const f=$('filter').value,w=row.warnings;let ok=f==='all'||row.review_status===f||(f==='unreviewed'&&!row.reviewed)||(f==='incorrect'&&w.incorrect_without_correction)||(f==='catalog'&&(w.candidate_catalog_violation||w.expected_catalog_violation))||(f==='warnings'&&(w.duplicate||w.conflict));return ok&&(!$('onlyWarnings').checked||Object.values(w).some(Boolean))}
function refresh(reset=false){const current=visible[cursor]?.case_id;visible=data.rows.filter(matches);if(reset)cursor=0;else if(current){const i=visible.findIndex(r=>r.case_id===current);cursor=i<0?Math.min(cursor,Math.max(0,visible.length-1)):i}render()}
function badges(w){const names={duplicate:'同一入力の重複',conflict:'正解の矛盾',candidate_catalog_violation:'予測が catalog 外',expected_catalog_violation:'正解が catalog 外',incorrect_without_correction:'incorrect・補正なし'};return Object.entries(w).filter(x=>x[1]).map(x=>`<span class="badge">${names[x[0]]}</span>`).join('')}
function render(){const reviewed=data.rows.filter(r=>r.reviewed).length;$('progress').textContent=`${reviewed} / ${data.rows.length} reviewed`;$('count').textContent=`${visible.length} 件中 ${visible.length?cursor+1:0} 件目`;$('output').textContent=`保存先: ${data.output||''}`;if(!visible.length){$('content').innerHTML='<div class="empty">該当する候補はありません</div>';return}const r=visible[cursor],opts=data.catalog.map(c=>`<option value="${esc(c.name)}" ${r.expected_command===c.name?'selected':''}>${esc(c.name)}</option>`).join('');$('content').innerHTML=`
<div class="eyebrow">${esc(r.case_id)} · ${esc(r.source)} · group ${esc(r.group_id)}</div><div class="input">${esc(r.input_text)}</div><div class="warnings">${badges(r.warnings)}</div>
<div class="grid"><div class="panel"><strong>予測</strong><dl><dt>command</dt><dd>${esc(r.candidate_command)||'—'}</dd><dt>args</dt><dd>${esc(r.candidate_args)||'—'}</dd><dt>feedback</dt><dd>${esc(r.feedback_label)||'—'} ${esc(r.feedback_correction)}</dd><dt>model / prompt</dt><dd>${esc(r.llm_model)||'—'} / ${esc(r.prompt_version)||'—'}</dd><dt>artifact / dataset</dt><dd>${esc(r.artifact_version)||'—'} / ${esc(r.dataset_version)||'—'}</dd></dl></div>
<div class="panel"><strong>正解</strong><label for="command">command</label><select id="command"><option value="">選択してください</option>${opts}</select><label for="args">args</label><input id="args" value="${esc(r.expected_args)}"><label for="note">レビュー理由・メモ</label><textarea id="note">${esc(r.review_note)}</textarea><small>現在: ${esc(r.review_status)}${r.reviewed_at?' · '+esc(r.reviewed_at):''}</small></div></div>
<div class="actions"><button class="primary" onclick="save('accepted')">採用</button><button onclick="save('corrected')">修正</button><button class="exclude" onclick="save('excluded')">除外</button><button onclick="save('pending')">保留</button></div><div class="nav"><button onclick="move(-1)">← 前</button><button onclick="move(1)">次 →</button><button onclick="save('unreviewed')">未レビューへ戻す</button></div>`}
async function save(status){const r=visible[cursor],oldCursor=cursor;let command=$('command').value,args=$('args').value;if(status==='accepted'){command=r.candidate_command;args=r.candidate_args}try{const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:r.case_id,review_status:status,expected_command:command,expected_args:args,review_note:$('note').value})});const body=await response.json();if(!response.ok)throw new Error(body.error);data=body;$('message').textContent='保存しました';visible=data.rows.filter(matches);const savedIndex=visible.findIndex(row=>row.case_id===r.case_id);cursor=savedIndex>=0?Math.min(savedIndex+1,visible.length-1):Math.min(oldCursor,Math.max(0,visible.length-1));render()}catch(e){$('message').textContent=`保存できません: ${e.message}`}}
function move(delta){cursor=Math.max(0,Math.min(visible.length-1,cursor+delta));render()}
$('filter').onchange=()=>refresh(true);$('onlyWarnings').onchange=()=>refresh(true);
fetch('/api/data').then(r=>r.json()).then(body=>{data=body;refresh(true)}).catch(e=>{$('content').textContent=`読み込み失敗: ${e}`});
</script></body></html>
