services:
  dspy-resolver:
    build:
      context: ../../
      dockerfile: tools/dspy-resolver/Dockerfile
    container_name: smarthome-dspy-resolver
    environment:
      - MODEL=${MODEL:-openai/gpt-4o-mini}
      - OPENAI_API_KEY
      - LM_API_BASE=${LM_API_BASE:-}
      - LM_API_KEY=${LM_API_KEY:-}
      - LM_MODEL_TYPE=${LM_MODEL_TYPE:-chat}
      - LM_TEMPERATURE=${LM_TEMPERATURE:-}
      - LM_MAX_TOKENS=${LM_MAX_TOKENS:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-smarthome-dspy-resolver}
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - DSPY_RESOLVER_TRACE_INCLUDE_INPUT=${DSPY_RESOLVER_TRACE_INCLUDE_INPUT:-false}
      - DSPY_RESOLVER_TRACE_INCLUDE_HTTP_BODY=${DSPY_RESOLVER_TRACE_INCLUDE_HTTP_BODY:-false}
    ports:
      - "${DSPY_RESOLVER_PORT:-18089}:8080"
    restart: unless-stopped
