name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Security Scan (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -exclude=G404 ./...

      - name: Vulnerability Check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  dspy-resolver-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirements:
          - tools/dspy/requirements.txt
          - tools/dspy-resolver/requirements-dev.txt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/dspy/requirements.txt
            tools/dspy-resolver/requirements.txt
            tools/dspy-resolver/requirements-dev.txt

      - name: Install Python test dependencies
        run: python -m pip install -r ${{ matrix.requirements }} 'pytest>=8.0,<9.0'

      - name: Check Python dependencies
        run: python -m pip check

      - name: Test DSPy tools
        env:
          PYTHONPATH: tools
        run: |
          if [ "${{ matrix.requirements }}" = "tools/dspy/requirements.txt" ]; then
            python -m pytest tools/dspy tools/dspy_common
          else
            python -m pytest tools/dspy-resolver tools/dspy tools/dspy_common
          fi
